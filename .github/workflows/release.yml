name: Release candidate bundles

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  attestations: write
  contents: read
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bundle:
    name: Unsigned bundle · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            packages/light-frame-qc/pyproject.toml
            engine/native/python/pyproject.toml
            packages/openastroflow-engine/pyproject.toml
            packaging/worker/requirements-build.txt

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Select Rust toolchain
        shell: bash
        run: |
          rustup set profile minimal
          rustup toolchain install 1.88 --component clippy --component rustfmt
          rustup default 1.88

      - name: Install scientific and packaging dependencies
        shell: bash
        run: >-
          python -m pip install
          -e "./packages/light-frame-qc[test]"
          -e "./engine/native/python[test]"
          -e "./packages/openastroflow-engine[test,all]"
          -r packaging/worker/requirements-build.txt

      - name: Check installed dependency consistency
        run: python -m pip check

      - name: Build, test and install the native CPU/Metal runtime
        shell: bash
        run: >-
          python scripts/build_native_runtime.py
          --build-dir build/native-release
          --report build/native-release/native-build-report.json

      - name: Test source tree and release gates
        shell: bash
        run: |
          python -m pytest -q packages/light-frame-qc/tests engine/native/python/tests packages/openastroflow-engine/tests tests
          python scripts/check_public_tree.py .
          python scripts/check_local_links.py .
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked

      - name: Materialize digest-pinned macOS 14 runtime libraries
        if: runner.os == 'macOS'
        shell: bash
        run: >-
          python scripts/fetch_macos14_runtime_libraries.py
          --output build/macos14-runtime-libraries

      - name: Freeze and attest scientific sidecar
        shell: bash
        run: |
          if [[ "${RUNNER_OS}" == "macOS" ]]; then
            python scripts/build_worker_sidecar.py \
              --output-dir build/sidecars \
              --macos14-bottle-root build/macos14-runtime-libraries
          else
            python scripts/build_worker_sidecar.py --output-dir build/sidecars
          fi
          python -c "from scripts.build_worker_sidecar import detect_host_target_triple; print('OAF_TARGET=' + detect_host_target_triple())" >> "$GITHUB_ENV"

      - name: Stage identity-bound Tauri external binary
        shell: bash
        run: >-
          python scripts/stage_tauri_sidecar.py
          "build/sidecars/openastroflow-worker-${OAF_TARGET}.manifest.json"
          --target "${OAF_TARGET}"

      - name: Build desktop bundle
        shell: bash
        working-directory: apps/desktop
        env:
          CI: "true"
        run: |
          npm ci
          npm test
          if [[ "${RUNNER_OS}" == "macOS" ]]; then
            npm run tauri:build:macos-prerelease
          else
            npm run tauri:build
          fi

      - name: Create create-only macOS disk image
        if: runner.os == 'macOS'
        shell: bash
        run: |
          oaf_dmg_stage="$(mktemp -d)"
          oaf_version="$(node -p "require('./apps/desktop/package.json').version")"
          oaf_dmg_path="target/release/bundle/dmg/Ultra-Fast-WBPP_${oaf_version}_aarch64.dmg"
          trap 'rm -rf "${oaf_dmg_stage}"' EXIT
          cp -R "target/release/bundle/macos/Ultra-Fast WBPP.app" "${oaf_dmg_stage}/"
          ln -s /Applications "${oaf_dmg_stage}/Applications"
          mkdir -p target/release/bundle/dmg
          test ! -e "${oaf_dmg_path}"
          hdiutil create \
            -volname "Ultra-Fast WBPP" \
            -srcfolder "${oaf_dmg_stage}" \
            -format UDZO \
            -imagekey zlib-level=9 \
            "${oaf_dmg_path}"
          hdiutil verify "${oaf_dmg_path}"

      - name: Attest the read-only DMG application and cold-start budget
        if: runner.os == 'macOS'
        shell: bash
        run: |
          oaf_version="$(node -p "require('./apps/desktop/package.json').version")"
          oaf_dmg_path="target/release/bundle/dmg/Ultra-Fast-WBPP_${oaf_version}_aarch64.dmg"
          oaf_mount="$(mktemp -d)"
          trap 'hdiutil detach "${oaf_mount}" >/dev/null 2>&1 || true; rmdir "${oaf_mount}" >/dev/null 2>&1 || true' EXIT
          hdiutil attach -readonly -nobrowse -mountpoint "${oaf_mount}" "${oaf_dmg_path}"
          codesign --verify --deep --strict "${oaf_mount}/Ultra-Fast WBPP.app"
          mkdir -p build/bundle-attestations
          python scripts/attest_bundled_runtime.py \
            --app "${oaf_mount}/Ultra-Fast WBPP.app" \
            --target "${OAF_TARGET}" \
            --max-start-seconds 5 \
            --output "build/bundle-attestations/openastroflow-worker-${OAF_TARGET}.bundled.manifest.json"
          hdiutil detach "${oaf_mount}"
          rmdir "${oaf_mount}"
          trap - EXIT

      - name: Collect bundles, manifests, and checksums
        shell: bash
        run: |
          python scripts/collect_release_artifacts.py \
            --target "${OAF_TARGET}" \
            --output build/release-artifacts \
            --source-commit "${GITHUB_SHA}" \
            --sidecar-root apps/desktop/src-tauri/resources/openastroflow-worker

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: build/release-artifacts/*

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ultra-fast-wbpp-${{ matrix.os }}-${{ github.ref_name }}
          path: build/release-artifacts/
          if-no-files-found: error
          retention-days: 14

  publish-prerelease:
    name: Prepare draft unsigned prerelease
    if: startsWith(github.ref, 'refs/tags/v')
    needs: bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          # Windows remains a validation-only artifact until installed-runtime
          # attestation, installer smoke, and Authenticode gates exist.
          pattern: ultra-fast-wbpp-macos-14-*
          path: release-assets
          merge-multiple: true
      - name: Create draft GitHub prerelease for maintainer review
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          release-assets/*
          --repo "${GITHUB_REPOSITORY}"
          --verify-tag
          --draft
          --prerelease
          --title "Ultra-Fast WBPP ${GITHUB_REF_NAME} (macOS arm64 unsigned prerelease)"
          --notes "Unsigned macOS arm64 validation build. Verify the included SHA256SUMS files. It is ad-hoc signed, not notarized, and not a stable release. Windows artifacts remain CI-only until installed-runtime attestation, installer smoke, and Authenticode gates pass."
