name: Release candidate bundles

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  attestations: write
  contents: read
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  versions:
    name: Version fields agree
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Require one version in package.json, tauri.conf.json, Cargo.toml and the tag
        # Fails in seconds on Linux, before any macOS or Windows runner starts.
        # A tag may add a pre-release label (v0.1.0-alpha.2 releases 0.1.0):
        # the Windows MSI accepts only numeric version components.
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: |
          if [[ -n "${RELEASE_TAG}" ]]; then
            python3 scripts/check_release_versions.py --tag "${RELEASE_TAG}"
          else
            python3 scripts/check_release_versions.py
          fi

  bundle:
    name: Unsigned bundle · ${{ matrix.os }}
    needs: versions
    runs-on: ${{ matrix.os }}
    # A Windows bundle took 25 minutes on the hosted runner (2026-09-21).
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        if: runner.os == 'Windows'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            packages/light-frame-qc/pyproject.toml
            packages/registration/pyproject.toml
            packages/engine/pyproject.toml
            packaging/engine/requirements-build.txt

      - name: Select the Homebrew Python 3.12 (macOS)
        if: runner.os == 'macOS'
        # The runtime overlay (packaging/engine/macos14-runtime-libraries-v1.json)
        # replaces the Homebrew openssl@3 and mpdecimal dylibs that a
        # Homebrew-built interpreter links against with digest-pinned Sonoma
        # bottles. setup-python installs python.org's framework build, which
        # bundles its own OpenSSL and links libmpdec statically, so the overlay
        # would find nothing to replace and the pinned ABI smoke could not hold.
        # The venv keeps pip out of Homebrew's externally managed site-packages
        # and is what the local macOS build uses as well. Homebrew pours the
        # bottle built for the runner's macOS: on macos-15 the interpreter and
        # its lib-dynload modules target macOS 15.0, which is why the app
        # declares macOS 15. The sidecar build refuses a newer interpreter
        # before freezing and audits the frozen tree right after PyInstaller.
        shell: bash
        run: |
          brew install python@3.12
          python_bin="$(brew --prefix python@3.12)/bin/python3.12"
          "${python_bin}" -m venv "${RUNNER_TEMP}/ufwbpp-venv"
          echo "${RUNNER_TEMP}/ufwbpp-venv/bin" >> "${GITHUB_PATH}"
          "${RUNNER_TEMP}/ufwbpp-venv/bin/python" -m pip install --upgrade pip
          "${RUNNER_TEMP}/ufwbpp-venv/bin/python" - <<'PY'
          import decimal, ssl, sys, _decimal
          print(sys.version, _decimal.__file__)
          print("libmpdec", decimal.__libmpdec_version__, "|", ssl.OPENSSL_VERSION)
          PY

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Select Rust toolchain
        shell: bash
        run: |
          rustup set profile minimal
          rustup toolchain install 1.88 --component clippy --component rustfmt
          rustup default 1.88

      - name: Install scientific and packaging dependencies
        shell: bash
        run: >-
          python -m pip install
          -e "./packages/light-frame-qc[test]"
          -e "./packages/registration[test]"
          -e "./packages/engine[test,all]"
          -r packaging/engine/requirements-build.txt

      - name: Replace the PyPI SEP wheel with the deterministic patched build (Windows)
        if: runner.os == 'Windows'
        # The frozen engine ships whatever sep is installed here: the pinned
        # sdist plus packaging/patches/*.patch makes MSVC builds deterministic
        # and linear in the object count (see scripts/build_sep_wheel.py).
        run: >-
          python scripts/build_sep_wheel.py --install
          --report build/sep-wheel/sep-wheel-report.json

      - name: Check installed dependency consistency
        run: python -m pip check

      - name: Build, test and install the native CPU/Metal runtime (static CRT on Windows)
        shell: bash
        run: >-
          python scripts/build_native_runtime.py
          --build-dir build/native-release
          --report build/native-release/native-build-report.json
          ${{ runner.os == 'Windows' && '--require-static-crt' || '' }}

      - name: Install the desktop dependencies
        # Before the tests: the Tauri config schema test validates
        # tauri.conf.json against the installed CLI's schema (node_modules).
        shell: bash
        working-directory: apps/desktop
        run: npm ci

      - name: Test source tree and release gates
        shell: bash
        run: |
          python -m pytest -q packages/light-frame-qc/tests packages/registration/tests packages/engine/tests tests
          python scripts/check_public_tree.py .
          python scripts/check_local_links.py .
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked

      - name: Materialize digest-pinned macOS 14 runtime libraries
        if: runner.os == 'macOS'
        shell: bash
        run: >-
          python scripts/fetch_macos14_runtime_libraries.py
          --output build/macos14-runtime-libraries

      - name: Freeze and attest scientific sidecar
        shell: bash
        run: |
          if [[ "${RUNNER_OS}" == "macOS" ]]; then
            python scripts/build_engine_sidecar.py \
              --output-dir build/sidecars \
              --macos14-bottle-root build/macos14-runtime-libraries
          else
            python scripts/build_engine_sidecar.py --output-dir build/sidecars
          fi
          python -c "from scripts.build_engine_sidecar import detect_host_target_triple; print('UFWBPP_TARGET=' + detect_host_target_triple())" >> "$GITHUB_ENV"

      - name: Stage identity-bound Tauri external binary
        shell: bash
        run: >-
          python scripts/stage_tauri_sidecar.py
          "build/sidecars/ufwbpp-engine-${UFWBPP_TARGET}.manifest.json"
          --target "${UFWBPP_TARGET}"

      - name: Build desktop bundle
        shell: bash
        working-directory: apps/desktop
        env:
          CI: "true"
        run: |
          npm test
          if [[ "${RUNNER_OS}" == "macOS" ]]; then
            npm run tauri:build:macos-prerelease
          else
            npm run tauri:build
          fi

      - name: Create create-only macOS disk image
        if: runner.os == 'macOS'
        shell: bash
        run: |
          ufwbpp_dmg_stage="$(mktemp -d)"
          ufwbpp_version="$(node -p "require('./apps/desktop/package.json').version")"
          ufwbpp_dmg_path="target/release/bundle/dmg/Ultra-Fast-WBPP_${ufwbpp_version}_aarch64.dmg"
          trap 'rm -rf "${ufwbpp_dmg_stage}"' EXIT
          cp -R "target/release/bundle/macos/Ultra-Fast WBPP.app" "${ufwbpp_dmg_stage}/"
          ln -s /Applications "${ufwbpp_dmg_stage}/Applications"
          mkdir -p target/release/bundle/dmg
          test ! -e "${ufwbpp_dmg_path}"
          hdiutil create \
            -volname "Ultra-Fast WBPP" \
            -srcfolder "${ufwbpp_dmg_stage}" \
            -format UDZO \
            -imagekey zlib-level=9 \
            "${ufwbpp_dmg_path}"
          hdiutil verify "${ufwbpp_dmg_path}"

      - name: Attest the read-only DMG application and cold-start budget
        if: runner.os == 'macOS'
        shell: bash
        run: |
          ufwbpp_version="$(node -p "require('./apps/desktop/package.json').version")"
          ufwbpp_dmg_path="target/release/bundle/dmg/Ultra-Fast-WBPP_${ufwbpp_version}_aarch64.dmg"
          ufwbpp_mount="$(mktemp -d)"
          trap 'hdiutil detach "${ufwbpp_mount}" >/dev/null 2>&1 || true; rmdir "${ufwbpp_mount}" >/dev/null 2>&1 || true' EXIT
          hdiutil attach -readonly -nobrowse -mountpoint "${ufwbpp_mount}" "${ufwbpp_dmg_path}"
          codesign --verify --deep --strict "${ufwbpp_mount}/Ultra-Fast WBPP.app"
          mkdir -p build/bundle-attestations
          python scripts/attest_bundled_runtime.py \
            --app "${ufwbpp_mount}/Ultra-Fast WBPP.app" \
            --target "${UFWBPP_TARGET}" \
            --max-start-seconds 5 \
            --output "build/bundle-attestations/ufwbpp-engine-${UFWBPP_TARGET}.bundled.manifest.json"
          hdiutil detach "${ufwbpp_mount}"
          rmdir "${ufwbpp_mount}"
          trap - EXIT

      - name: Install the MSI silently, attest the installed runtime, uninstall (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        # msiexec /i ... /qn -> PE import-closure audit + launch budget + doctor
        # against the tree WiX installed (not the build directory) -> /x /qn.
        # The launch budget is wider than the 5 s macOS one because a first
        # launch of the frozen tree on a hosted runner pays for on-access
        # scanning of thousands of files. The NSIS installer shares the same
        # frozen engine bytes and is collected below; Authenticode signing
        # remains a documented release gate that this unsigned prerelease
        # pipeline does not perform.
        run: |
          $msi = @(Get-ChildItem -Path target/release/bundle/msi -Filter *.msi -File)
          if ($msi.Count -ne 1) { throw "expected exactly one MSI, found $($msi.Count)" }
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/windows/attest-installed-msi.ps1 `
            -Msi $msi[0].FullName `
            -Target $env:UFWBPP_TARGET `
            -MaxStartSeconds 20 `
            -Output "build/bundle-attestations/ufwbpp-engine-$($env:UFWBPP_TARGET).bundled.manifest.json"
          if ($LASTEXITCODE -ne 0) { throw "installed-MSI attestation failed with $LASTEXITCODE" }

      - name: Collect bundles, manifests, and checksums
        shell: bash
        run: |
          python scripts/collect_release_artifacts.py \
            --target "${UFWBPP_TARGET}" \
            --output build/release-artifacts \
            --source-commit "${GITHUB_SHA}" \
            --sidecar-root apps/desktop/src-tauri/resources/ufwbpp-engine

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: build/release-artifacts/*

      - name: Name the upload after the ref (safe for branch names with '/')
        id: artifact
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
          RUNNER_LABEL: ${{ matrix.os }}
        run: echo "name=ultra-fast-wbpp-${RUNNER_LABEL}-${REF_NAME//[^A-Za-z0-9._-]/-}" >> "${GITHUB_OUTPUT}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: build/release-artifacts/
          if-no-files-found: error
          retention-days: 14

  publish-prerelease:
    name: Prepare draft unsigned prerelease
    # One platform's failure must not hold back the other: the draft carries
    # every platform whose bundle job uploaded attested artifacts (the upload
    # is that job's last step) and names the missing one. With no platform,
    # or when the version check failed (bundle skipped), nothing is drafted.
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') && needs.bundle.result != 'skipped' }}
    needs: bundle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          # Every platform that passed: the Windows MSI/NSIS pass the
          # installed-runtime attestation (PE import closure, static-CRT
          # kernels, launch budget) and the macOS DMG the deployment and
          # launch attestation in the bundle job before they are uploaded.
          pattern: ultra-fast-wbpp-*
          path: release-assets
          merge-multiple: true
      - name: Write the prerelease notes for the platforms that built and attested
        # Fails when no platform did; checks each platform's SHA256SUMS
        # against the downloaded files.
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: >-
          python3 scripts/write_prerelease_notes.py
          --assets release-assets
          --notes release-notes.md
          --title release-title.txt
          --run-url "${RUN_URL}"
      - name: Create draft GitHub prerelease for maintainer review
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          release-assets/*
          --repo "${GITHUB_REPOSITORY}"
          --verify-tag
          --draft
          --prerelease
          --title "Ultra-Fast WBPP ${GITHUB_REF_NAME} ($(cat release-title.txt))"
          --notes-file release-notes.md
