# One configuration for every test directory, so `python -m pytest` at the
# repository root is the whole Python suite (what CI runs) and the root
# conftest.py applies whichever directory is named on the command line.
[pytest]
testpaths =
    packages/light-frame-qc/tests
    packages/registration/tests
    packages/engine/tests
    tests
# The sources of this checkout come first, so a git worktree tests its own
# code even when the virtual environment's editable installs point elsewhere.
pythonpath =
    packages/engine/src
    packages/light-frame-qc/src
    packages/registration/src
# Failures, errors and skip reasons at the end of the run.
addopts = -r fEs
