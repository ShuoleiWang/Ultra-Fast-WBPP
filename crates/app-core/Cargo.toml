[package]
name = "openastroflow-app-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Cross-platform product control-plane contracts for Ultra-Fast WBPP"
license = "MIT"
readme = "README.md"
publish = false

[lib]
name = "openastroflow_app_core"
path = "src/lib.rs"

[[bin]]
name = "export-openastroflow-schemas"
path = "src/bin/export_schemas.rs"

[dependencies]
schemars = { version = "0.8.22", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
thiserror = "2.0.17"

[dev-dependencies]
tempfile = "3.23.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
