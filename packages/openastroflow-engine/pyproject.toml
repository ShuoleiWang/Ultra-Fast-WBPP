[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openastroflow-engine"
version = "0.1.0"
description = "Quality-gated raw-to-solved astrophotography engine and canonical worker"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Shuolei Wang"}]
keywords = ["astronomy", "astrophotography", "FITS", "drizzle", "astrometry"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS :: MacOS X",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
  "astropy>=7.0",
  "light-frame-qc>=0.3.0",
  "numpy>=2.0",
  "openastroflow-registration>=0.1.0a1",
  "Pillow>=11",
  "xisf>=0.9,<1",
  "lz4>=4.4,<5",
  "zstandard>=0.25,<1",
]

[project.optional-dependencies]
test = ["pytest>=8", "jsonschema>=4.23"]
drizzle = ["drizzle>=2.2,<3"]
mosaic = ["reproject>=0.21,<0.22", "shapely>=2.1,<3"]
all = [
  "drizzle>=2.2,<3",
  "reproject>=0.21,<0.22",
  "shapely>=2.1,<3",
]

[project.scripts]
ultra-fast-wbpp = "openastroflow_engine.cli:main"
openastroflow-engine = "openastroflow_engine.cli:main"
openastroflow-worker = "openastroflow_engine.worker:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
openastroflow_engine = [
  "py.typed",
  "native/*.dylib",
  "native/*.so",
  "native/*.dll",
  "native/*.md",
]

[tool.setuptools.data-files]
"share/openastroflow/catalogs" = ["../../resources/catalogs/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src", "../light-frame-qc/src"]
testpaths = ["tests"]
