[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ufwbpp-registration"
version = "0.1.0a1"
description = "Portable star detection, registration, warping, and common-footprint geometry for Ultra-Fast WBPP"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Shuolei Wang"}]
dependencies = [
  "numpy>=2.0",
  "scipy>=1.14",
  "astropy>=7.0",
  "sep>=1.4",
  "scikit-image>=0.25",
  "astroalign>=2.6",
  "light-frame-qc>=0.3.0",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["ufwbpp_registration*"]
