[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ufwbpp"
version = "0.1.0"
description = "Ultra-Fast WBPP engine: quality-gated raw Lights to verified, plate-solved linear masters"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Shuolei Wang"}]
keywords = ["astronomy", "astrophotography", "FITS", "drizzle", "astrometry"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS :: MacOS X",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
  "astropy>=7.0",
  "light-frame-qc>=0.3.0",
  "numpy>=2.0",
  "ufwbpp-registration>=0.1.0a1",
  "Pillow>=11",
  "lz4>=4.4,<5",
  "zstandard>=0.25,<1",
]

[project.optional-dependencies]
test = ["pytest>=8", "jsonschema>=4.23"]
mosaic = ["reproject>=0.21,<0.22", "shapely>=2.1,<3"]
all = [
  "reproject>=0.21,<0.22",
  "shapely>=2.1,<3",
]

[project.scripts]
ultra-fast-wbpp = "ufwbpp.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ufwbpp = [
  "py.typed",
  "native/*.dylib",
  "native/*.so",
  "native/*.dll",
  "native/*.md",
  "solvers/catalog_manifests/*.json",
  "solvers/catalog_manifests/*.md",
]

[tool.pytest.ini_options]
pythonpath = ["src", "../light-frame-qc/src"]
testpaths = ["tests"]
