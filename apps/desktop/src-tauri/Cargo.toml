[package]
name = "openastroflow-desktop"
version = "0.1.0"
description = "Ultra-Fast WBPP desktop workflow shell"
authors = ["Ultra-Fast WBPP contributors"]
edition = "2021"
rust-version = "1.88"
license = "MIT"

[lib]
name = "openastroflow_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
openastroflow-app-core = { path = "../../../crates/app-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
